name: Validate app configs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  config:
    name: config.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Validate app configs
        run: python3 .github/scripts/validate_configs.py

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: .github/scripts/run_shellcheck.sh
